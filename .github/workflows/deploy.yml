# Da mettere in .github/workflows/deploy.yml
# A ogni push su main:
#  1. pubblica l'anteprima su https://<utente>.github.io/<nome-repo>/
#  2. prepara lo zip "sebd2027-icar" da mandare al tecnologo
#     (scaricabile dalla scheda Actions, in fondo alla pagina dell'esecuzione)

name: Build e deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Versione per GitHub Pages (servita da /<nome-repo>/)
      - run: npx astro build --site https://${{ github.repository_owner }}.github.io --base /${{ github.event.repository.name }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # Versione per sebd2027.icar.cnr.it (servita dalla radice)
      - run: npx astro build --site https://sebd2027.icar.cnr.it --base / --outDir dist-icar

      - uses: actions/upload-artifact@v4
        with:
          name: sebd2027-icar
          path: dist-icar

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4